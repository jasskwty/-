plugins { id 'com.android.application' }

android {
    namespace 'tv.shashati'
    compileSdk 34
    defaultConfig {
        applicationId 'tv.shashati'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs straight away with adb.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
